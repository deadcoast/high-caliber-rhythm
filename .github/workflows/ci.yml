# The game runs here, headless, on every push: the real extension, the real
# scene, the engine tests and the autoplay smoke. Red means the game is broken.
name: downbeat
on: [push, pull_request]
jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Godot 4.7.2 headless
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: core tests
        run: cd core && cargo test --release
      - name: engine tests and autoplay smoke (the game, headless)
        run: tools/build.sh --test --smoke
      - name: server tests
        run: cd server && cargo test --release
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd web && npm ci && npm run core && npm run check && npm run build
